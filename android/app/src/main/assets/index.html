<body class="bg-slate-50 dark:bg-black text-slate-600 dark:text-neutral-300 font-sans antialiased h-[100dvh] flex flex-col overflow-hidden selection:bg-indigo-100 selection:text-indigo-700 no-scrollbar touch-manipulation transition-colors duration-300 no-tap select-none">

  <header class="px-4 py-2 flex justify-between items-center z-40 shrink-0 bg-white/90 dark:bg-neutral-900 backdrop-blur-sm border-b border-slate-200 dark:border-neutral-800 h-[60px] transition-colors duration-300">
      <div class="flex items-center gap-3 cursor-pointer group active:opacity-70" onclick="app.goHome()">
          <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md transition-transform">
              <i class="ph-bold ph-translate text-xl"></i>
          </div>
          <div class="flex flex-col">
              <h1 class="font-black text-lg text-slate-800 dark:text-white leading-none tracking-tight landscape-hide">VocabMaster</h1>
              <span id="status-bar" class="text-[10px] font-extrabold text-slate-500 dark:text-neutral-400 uppercase tracking-wider mt-0.5">Ready</span>
          </div>
      </div>
      <div class="flex gap-2">
          <button id="btn-login" onclick="app.handleAuthClick()" class="w-10 h-10 bg-white dark:bg-neutral-800 hover:bg-slate-50 dark:hover:bg-neutral-700 text-slate-600 dark:text-neutral-200 rounded-full flex items-center justify-center transition-all active:scale-90 border border-slate-200 dark:border-neutral-700 shadow-sm"><i class="ph-bold ph-user text-xl"></i></button>
          <button aria-label="Toggle Fullscreen" onclick="app.toggleFull()" class="w-10 h-10 bg-white dark:bg-neutral-800 hover:bg-slate-50 dark:hover:bg-neutral-700 text-slate-600 dark:text-neutral-200 rounded-full flex items-center justify-center transition-all active:scale-90 border border-slate-200 dark:border-neutral-700 shadow-sm"><i class="ph-bold ph-arrows-out text-xl"></i></button>
          <button aria-label="Settings" onclick="app.modal(true)" class="w-10 h-10 bg-white dark:bg-neutral-800 hover:bg-slate-50 dark:hover:bg-neutral-700 text-slate-600 dark:text-neutral-200 rounded-full flex items-center justify-center transition-all active:scale-90 border border-slate-200 dark:border-neutral-700 shadow-sm"><i class="ph-bold ph-gear text-xl"></i></button>
      </div>
  </header>

  <main id="app-view" class="flex-1 overflow-hidden relative w-full max-w-7xl mx-auto p-2 sm:p-4 flex flex-col"></main>

  <div id="fab-container" class="fixed bottom-6 right-6 z-30 pointer-events-none"></div>
  <div id="hanzi-tooltip" class="fixed z-[9999] hidden transition-opacity duration-200 opacity-0"></div>

  <div id="modal-profile" class="fixed inset-0 bg-black/60 z-[80] hidden flex items-center justify-center backdrop-blur-sm p-4"><div class="bg-white dark:bg-neutral-900 w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col border border-slate-200 dark:border-neutral-800"><div id="profile-content"></div></div></div>
  <div id="modal-stats" role="dialog" aria-modal="true" class="fixed inset-0 bg-black/60 z-[80] hidden flex items-center justify-center backdrop-blur-sm p-4">
    <div id="stats-modal-inner" class="bg-white dark:bg-neutral-900 w-full rounded-3xl p-6 shadow-2xl flex flex-col border border-slate-200 dark:border-neutral-800">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h2 class="text-xl font-black text-slate-800 dark:text-white">Activity Stats</h2>
        <button aria-label="Close" onclick="document.getElementById('modal-stats').classList.add('hidden')" class="w-8 h-8 bg-slate-100 dark:bg-neutral-800 rounded-full flex items-center justify-center hover:bg-slate-200 dark:hover:bg-neutral-700 transition-colors"><i class="ph-bold ph-x"></i></button>
      </div>
      <div class="flex gap-1 mb-4 shrink-0 bg-slate-100 dark:bg-neutral-800 rounded-xl p-1" id="stats-tabs">
        <button onclick="app.ui.showStatsTab('weekly')" class="stats-tab flex-1 py-2 px-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all bg-white dark:bg-neutral-700 text-indigo-600 dark:text-indigo-400 shadow-sm" data-tab="weekly">Weekly</button>
        <button onclick="app.ui.showStatsTab('accuracy')" class="stats-tab flex-1 py-2 px-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all text-slate-400 hover:text-slate-600 dark:hover:text-neutral-300" data-tab="accuracy">Accuracy</button>
        <button onclick="app.ui.showStatsTab('words')" class="stats-tab flex-1 py-2 px-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all text-slate-400 hover:text-slate-600 dark:hover:text-neutral-300" data-tab="words">Words</button>
        <button onclick="app.ui.showStatsTab('activity')" class="stats-tab flex-1 py-2 px-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all text-slate-400 hover:text-slate-600 dark:hover:text-neutral-300" data-tab="activity">Activity</button>
      </div>
      <div id="stats-tab-content" class="flex-1 overflow-y-auto flex flex-col min-h-0">
        <div id="tab-weekly" class="stats-panel flex-1 flex flex-col min-h-0">
          <div class="flex items-center justify-between mb-3 shrink-0">
            <div class="flex gap-1 bg-slate-100 dark:bg-neutral-800 rounded-lg p-0.5">
              <button onclick="app.ui.showWeeklyView('chart')" id="wv-chart" class="weekly-view-btn py-1.5 px-3 rounded-md text-[10px] font-black uppercase tracking-wider transition-all bg-white dark:bg-neutral-700 text-indigo-600 dark:text-indigo-400 shadow-sm">Bar Chart</button>
              <button onclick="app.ui.showWeeklyView('heatmap')" id="wv-heatmap" class="weekly-view-btn py-1.5 px-3 rounded-md text-[10px] font-black uppercase tracking-wider transition-all text-slate-400 hover:text-slate-600 dark:hover:text-neutral-300">Heatmap</button>
            </div>
            <div id="heatmap-legend" class="hidden items-center gap-1">
              <span style="font-size:9px" class="text-slate-400 dark:text-slate-500">Less</span>
              <div style="width:10px;height:10px;border-radius:2px;background:var(--hm-l0)"></div>
              <div style="width:10px;height:10px;border-radius:2px;background:var(--hm-l1)"></div>
              <div style="width:10px;height:10px;border-radius:2px;background:var(--hm-l2)"></div>
              <div style="width:10px;height:10px;border-radius:2px;background:var(--hm-l3)"></div>
              <div style="width:10px;height:10px;border-radius:2px;background:var(--hm-l4)"></div>
              <span style="font-size:9px" class="text-slate-400 dark:text-slate-500">More</span>
            </div>
          </div>
          <div id="weekly-chart-view" class="relative flex-1 min-h-0"><canvas id="stats-chart"></canvas></div>
          <div id="weekly-heatmap-view" class="hidden flex-1 flex flex-col justify-center"></div>
        </div>
        <div id="tab-accuracy" class="stats-panel hidden flex-1 flex flex-col min-h-0"></div>
        <div id="tab-words" class="stats-panel hidden flex-1 flex flex-col min-h-0 overflow-y-auto"></div>
        <div id="tab-activity" class="stats-panel hidden flex-1 flex flex-col min-h-0 overflow-y-auto"></div>

  <div id="modal-note" role="dialog" aria-modal="true" class="fixed inset-0 bg-black/80 z-[70] hidden flex items-center justify-center backdrop-blur-sm p-4"><div class="bg-white dark:bg-neutral-900 w-full max-w-6xl rounded-3xl shadow-2xl max-h-[90vh] flex flex-col border border-slate-200 dark:border-neutral-800 relative overflow-hidden"><div class="flex justify-between items-center p-4 border-b border-slate-100 dark:border-neutral-800 bg-slate-50 dark:bg-neutral-900 backdrop-blur shrink-0"><h2 class="text-sm font-black text-slate-500 dark:text-neutral-400 uppercase tracking-widest flex items-center gap-2"><i class="ph-bold ph-notebook text-indigo-500"></i> Study Notes</h2><button aria-label="Close" onclick="app.notes.closeModal()" class="w-8 h-8 bg-slate-200 dark:bg-neutral-800 hover:bg-slate-300 text-slate-600 dark:text-neutral-300 rounded-full flex items-center justify-center transition-colors"><i class="ph-bold ph-x"></i></button></div><div id="note-toolbar" class="flex gap-1 p-2 bg-slate-100 dark:bg-neutral-800 border-b border-slate-200 dark:border-neutral-700 overflow-x-auto thin-scroll shrink-0 hidden"><button aria-label="Bold" data-cmd="bold" class="p-2 rounded hover:bg-white dark:hover:bg-neutral-700"><i class="ph-bold ph-text-b"></i></button><button aria-label="Italic" data-cmd="italic" class="p-2 rounded hover:bg-white dark:hover:bg-neutral-700"><i class="ph-bold ph-text-italic"></i></button><button aria-label="Underline" data-cmd="underline" class="p-2 rounded hover:bg-white dark:hover:bg-neutral-700"><i class="ph-bold ph-text-underline"></i></button><div class="w-px bg-slate-300 dark:bg-neutral-600 mx-1"></div><button aria-label="Bulleted List" data-cmd="insertUnorderedList" class="p-2 rounded hover:bg-white dark:hover:bg-neutral-700"><i class="ph-bold ph-list-bullets"></i></button><button data-cmd="formatBlock" data-val="H3" class="p-2 rounded hover:bg-white dark:hover:bg-neutral-700 font-bold text-xs">H3</button></div><div class="flex flex-col lg:flex-row flex-1 overflow-hidden relative bg-slate-50 dark:bg-black/20"><div id="hanzi-container" class="flex flex-col border-b lg:border-b-0 lg:border-r border-slate-100 dark:border-neutral-800 bg-slate-100 dark:bg-neutral-900 overflow-y-auto w-full lg:w-1/2 transition-all"><div class="p-4 space-y-3"><div id="hanzi-rows" class="space-y-4"></div><button id="btn-add-row" onclick="app.notes.addHanziRow()" class="w-full py-3 border-2 border-dashed border-slate-200 dark:border-neutral-700 rounded-xl text-slate-400 font-bold text-xs uppercase tracking-wider hover:border-indigo-400 hover:text-indigo-500 transition-colors hidden"><i class="ph-bold ph-plus"></i> Add Row</button></div></div><div id="rich-container" class="flex flex-col overflow-y-auto bg-white dark:bg-neutral-900 w-full lg:w-1/2 transition-all"><div id="note-body" class="p-6 prose dark:prose-invert prose-sm max-w-none focus:outline-none min-h-[200px] flex-1"></div></div></div><div id="note-footer" class="hidden p-4 border-t border-slate-100 dark:border-neutral-800 bg-white dark:bg-neutral-900 shrink-0 z-10"><button onclick="app.notes.saveCurrent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2"><i class="ph-bold ph-floppy-disk"></i> Save All</button></div></div></div>
  <div id="modal-edit" role="dialog" aria-modal="true" class="fixed inset-0 bg-black/60 z-[90] hidden flex items-center justify-center backdrop-blur-sm p-4"><div class="bg-white dark:bg-neutral-900 w-full max-w-lg rounded-3xl p-6 shadow-2xl flex flex-col border border-slate-200 dark:border-neutral-800 max-h-[90vh]"><div class="flex justify-between items-center mb-4 shrink-0"><div class="flex items-center gap-2"><h2 class="text-xl font-black text-slate-800 dark:text-white">Edit Word</h2><span id="edit-id" class="text-xs font-bold text-slate-400 bg-slate-100 dark:bg-neutral-800 px-2 py-1 rounded">#0</span></div><button aria-label="Close" onclick="app.ui.closeEditModal()" class="w-8 h-8 bg-slate-100 dark:bg-neutral-800 hover:bg-slate-200 dark:hover:bg-neutral-700 rounded-full flex items-center justify-center transition-colors"><i class="ph-bold ph-x"></i></button></div><div id="edit-form-body" class="flex-1 overflow-y-auto thin-scroll space-y-3 p-1"></div><div class="mt-4 pt-4 border-t border-slate-100 dark:border-neutral-800 shrink-0"><button onclick="app.ui.saveEdit()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2"><i class="ph-bold ph-floppy-disk"></i> Save Changes</button></div></div></div>
  
  <div id="modal-settings" role="dialog" aria-modal="true" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center backdrop-blur-sm p-4">
      <div class="bg-white dark:bg-neutral-900 w-full max-w-sm rounded-3xl p-6 shadow-2xl max-h-[90vh] flex flex-col border border-slate-200 dark:border-neutral-800">
        <div class="flex justify-between items-center mb-4 shrink-0"><h2 class="text-2xl font-black text-slate-800 dark:text-white">Settings</h2><button aria-label="Close" onclick="app.modal(false)" class="w-10 h-10 bg-slate-100 dark:bg-neutral-800 hover:bg-slate-200 dark:hover:bg-neutral-700 text-slate-600 dark:text-neutral-300 rounded-full flex items-center justify-center transition-colors"><i class="ph-bold ph-x"></i></button></div>
        <div class="overflow-y-auto thin-scroll pb-2 flex-1">
            <div id="settings-list" class="space-y-3">
            </div>
        </div>
    </div>
  </div>

  <div id="overlay-init" class="fixed inset-0 z-[100] bg-slate-900 dark:bg-black flex flex-col items-center justify-center text-white p-6 text-center">
      <div class="w-24 h-24 bg-indigo-500 rounded-3xl flex items-center justify-center mb-8 shadow-2xl shadow-indigo-500 animate-pulse"><i class="ph-fill ph-student text-6xl text-white"></i></div>
      <h2 class="text-4xl font-black mb-2 tracking-tight">VocabMaster</h2>
      <button id="btn-init" disabled class="bg-white text-slate-900 px-12 py-4 rounded-full font-black text-xl shadow-xl active:scale-95 transition-all mt-8 opacity-50 cursor-not-allowed">Start</button>
